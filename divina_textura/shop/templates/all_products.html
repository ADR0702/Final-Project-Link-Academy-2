{% extends "shop/base.html" %}
{% block title %}All Products{% endblock %}

{% block content %}
<main style="padding: 50px 30px;">
    <h1 style= "font-family: 'Playfair Display', serif; font-size:2rem; margin-bottom:30px; color: var(--main-color); text-align:center;">
        Explore Our Products
    </h1>

    <!-- FILTRE -->
    <form method="get" style="display:flex; gap:20px; justify-content:center; margin-bottom:40px; flex-wrap:wrap;">
        <!-- CATEGORIE -->
        <div>
            <label for="category" style="display:block; margin-bottom:8px; font-weight:600; color:var(--hover-color);">Category</label>
            <select name="category" id="category" onchange="this.form.submit()" 
                    style="padding:10px 15px; border:1px solid #ccc; border-radius:6px; font-size:1rem;">
                <option value="">All</option>
                {% for cat in categories %}
                    <option value="{{ cat.slug }}" {% if selected_category == cat.slug %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- SUBCATEGORIE -->
        <div>
            <label for="subcategory" style="display:block; margin-bottom:8px; font-weight:600; color:var(--hover-color);">Subcategory</label>
            <select name="subcategory" id="subcategory" onchange="this.form.submit()" 
                    style="padding:10px 15px; border:1px solid #ccc; border-radius:6px; font-size:1rem;">
                <option value="">All</option>
                {% for sub in subcategories %}
                    <option value="{{ sub.slug }}" {% if selected_subcategory == sub.slug %}selected{% endif %}>
                        {{ sub.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </form>

    <!-- LISTA PRODUSE -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:25px;">
        {% for product in products %}
        <div style="background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,0.08); text-align:center; transition:transform 0.3s, box-shadow 0.3s;">
            <a href="{% url 'product_detail_url' slug=product.slug %}" style="text-decoration:none;">
                <img src="{{ product.image.url }}" alt="{{ product.name }}" 
                     style="width:100%; max-height:280px; object-fit:contain; margin-bottom:15px; border-radius:8px;">
                <h3 style="font-size:1.2rem; margin-bottom:5px; color:var(--hover-color);">{{ product.name }}</h3>
                <p style="color:var(--main-color); font-weight:bold; margin-bottom:10px;">€{{ product.price }}</p>
                <span style="display:inline-block; margin-top:8px; font-size:0.95rem; color:var(--main-color); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">
                    View Product
                </span>
            </a>
        </div>
        {% empty %}
        <p style="text-align:center; font-size:1.1rem; color:#666; grid-column:1/-1;">No products available.</p>
        {% endfor %}
    </div>
</main>
{% endblock %}
